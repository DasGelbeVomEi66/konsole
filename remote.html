<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="only light">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#e9ecef">
<title>Fernbedienung</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap">
<style>
/*
VOICE: Werkzeug in der Hand, groß, eindeutig
IDEA: weiße Fernbedienung, hochkant
PICTURE: das Handy selbst wird zum Gehäuse mit Steuerkreuz, A-Taste und B-Taste
COLOUR and TYPE: Weiß, Hellgrau, Blau-LED; Nunito
LAYOUT: Spalte wie eine echte Fernbedienung, Tasten mit großen Trefferflächen
*/
:root{color-scheme:only light;--blue:#34bdef}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#d9dde1;font-family:Nunito,system-ui,sans-serif;color:#5c6064;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
.remote{position:fixed;inset:max(10px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom));background:linear-gradient(90deg,#e6e9ec,#fff 30%,#fff 70%,#e3e6e9);border-radius:46px;box-shadow:0 10px 30px rgba(0,0,0,.18),inset 0 0 0 2px #fff;display:flex;flex-direction:column;align-items:center;padding:26px 0 22px;gap:2.2vh}
.top{display:flex;align-items:center;gap:10px;font-weight:800;font-size:14px;color:#9aa0a5}
.led{width:12px;height:12px;border-radius:50%;background:#c4c8cc}
.led.on{background:var(--blue);box-shadow:0 0 10px var(--blue)}
.dpad{position:relative;width:min(44vw,180px);aspect-ratio:1;margin-top:1vh}
.dpad button{position:absolute;background:linear-gradient(#5c6064,#3d4145);border:0;color:#cfd3d6;font-size:18px}
.dpad .u,.dpad .d{left:33%;width:34%;height:38%}.dpad .u{top:0;border-radius:10px 10px 0 0}.dpad .d{bottom:0;border-radius:0 0 10px 10px}
.dpad .l,.dpad .r{top:33%;height:34%;width:38%}.dpad .l{left:0;border-radius:10px 0 0 10px}.dpad .r{right:0;border-radius:0 10px 10px 0}
.dpad .c{position:absolute;left:33%;top:33%;width:34%;height:34%;background:#3d4145}
.btnA{width:min(30vw,128px);aspect-ratio:1;border-radius:50%;border:0;background:radial-gradient(circle at 40% 30%,#fff,#e3e6e9);box-shadow:0 6px 0 #b9bec3,0 8px 16px rgba(0,0,0,.2);font:900 44px Nunito,sans-serif;color:#7d8287;margin-top:1vh}
.row3{display:flex;gap:6vw;align-items:center;margin-top:1vh}
.sm{width:56px;height:56px;border-radius:50%;border:0;background:linear-gradient(#fff,#e3e6e9);box-shadow:0 4px 0 #c4c8cc;font:900 26px Nunito,sans-serif;color:#7d8287}
.home{width:56px;height:56px;border-radius:50%;border:0;background:linear-gradient(#fff,#e3e6e9);box-shadow:0 4px 0 #c4c8cc;display:grid;place-items:center}
.btnB{flex:1;width:72%;max-height:150px;min-height:80px;border-radius:30px;border:0;background:linear-gradient(#f1f3f5,#d8dce0);box-shadow:inset 0 3px 6px rgba(0,0,0,.08),0 4px 0 #c4c8cc;font:900 36px Nunito,sans-serif;color:#7d8287}
.center{border:0;background:none;font:800 15px Nunito,sans-serif;color:#1b9fd6;padding:10px 18px;border-radius:999px;border:2px solid #b9e6f8}
.brand{font-weight:900;color:#c4c8cc;letter-spacing:.1em;font-size:13px}
button.down{transform:translateY(3px);filter:brightness(.92)}
.btnA.down{box-shadow:0 2px 0 #b9bec3}
.over{position:fixed;inset:0;background:#eceef0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px;padding:30px;text-align:center;z-index:5}
.over.hide{display:none}
.over h1{margin:0;font-size:30px;font-weight:900;color:#4c5054}
.over p{margin:0;font-weight:700;line-height:1.45;max-width:320px}
.over input{font:900 34px Nunito,sans-serif;letter-spacing:.3em;text-align:center;width:220px;padding:10px;border-radius:18px;border:3px solid #c4c8cc;text-transform:uppercase;color:#1b9fd6;background:#fff;user-select:text;-webkit-user-select:text}
.big{font:900 20px Nunito,sans-serif;background:var(--blue);color:#fff;border:0;border-radius:999px;padding:16px 30px;box-shadow:0 5px 0 #1b8fbf}
.msg{color:#e5242f;min-height:1.4em}
.opt{position:fixed;right:22px;top:max(22px,env(safe-area-inset-top));z-index:3;border:0;background:none;font:800 13px Nunito,sans-serif;color:#9aa0a5;padding:10px}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:26px 26px 0 0;padding:22px 22px max(22px,env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.2);z-index:6;transform:translateY(110%);transition:transform .3s}
.sheet.on{transform:none}
.sheet label{display:flex;justify-content:space-between;align-items:center;padding:12px 0;font-weight:800;border-bottom:1px solid #eceef0}
.sheet input[type=checkbox]{width:26px;height:26px}
.sheet input[type=range]{width:50%}
.wheel{position:fixed;left:50%;top:50%;width:100vw;height:100vh;transform:translate(-50%,-50%);display:none;background:linear-gradient(#f4f5f6,#dfe2e5);z-index:4}
.wheel.on{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:14px;padding:16px max(16px,env(safe-area-inset-left))}
.wheel.rot{width:100vh;height:100vw}
.wheel button{border:0;font:900 22px Nunito,sans-serif;color:#fff;border-radius:28px}
.w-brake{background:linear-gradient(#ff6b6b,#d63031);box-shadow:0 6px 0 #a61e1e}
.w-gas{background:linear-gradient(#5ee07a,#22a447);box-shadow:0 6px 0 #167a32}
.w-mid{display:grid;grid-template-rows:auto 1fr 1.3fr auto;gap:10px;min-height:0}
.w-info{text-align:center;font-weight:900;color:#5c6064;font-size:15px;line-height:1.3}
.w-info b{font-size:28px;color:#1b9fd6}
.w-item{background:linear-gradient(#ffd23d,#f0a500);box-shadow:0 5px 0 #b27a00}
.w-drift{background:linear-gradient(#6fc8ff,#1b9fd6);box-shadow:0 5px 0 #11739c}
.w-row{display:flex;gap:10px;align-items:center;justify-content:center}
.w-row .home{width:46px;height:46px}
.w-steer{flex:1;height:12px;border-radius:6px;background:#c9cdd1;position:relative;overflow:hidden}
.w-steer i{position:absolute;top:0;bottom:0;left:50%;width:6px;margin-left:-3px;background:#1b9fd6;border-radius:3px}
.wheel button.down{transform:translateY(4px);box-shadow:none}
.pad{position:fixed;inset:0;display:none;flex-direction:column;background:linear-gradient(#fdf6e3,#f3e2b8);z-index:4;padding:max(12px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}
.pad.on{display:flex}
.pad-head{border-radius:22px;color:#fff;font-weight:900;font-size:20px;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.pad-hint{text-align:center;font-weight:800;color:#7a5a2a;font-size:17px;margin:12px 6px;min-height:1.3em;line-height:1.35}
.pad-body{flex:1;display:flex;flex-direction:column;gap:14px;justify-content:center;align-items:center;min-height:0}
.pad button{border:0;font:900 24px Nunito,sans-serif;color:#fff;border-radius:26px;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.pad button.down{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.pad-btns{display:flex;gap:14px;width:100%;justify-content:center;flex-wrap:wrap}
.pad-btns button{flex:1 1 40%;min-height:96px;max-width:100%}
.pad-quiz{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;flex:1;max-height:62vh}
.pad-quiz button{font-size:20px;padding:10px;line-height:1.2}
.pad-dpad{position:relative;width:min(56vw,220px);aspect-ratio:1}
.pad-dpad button{position:absolute;background:linear-gradient(#5c6064,#3d4145);font-size:22px;box-shadow:0 4px 0 #222;border-radius:14px}
.pad-dpad .u,.pad-dpad .d{left:33%;width:34%;height:36%}.pad-dpad .u{top:0}.pad-dpad .d{bottom:0}
.pad-dpad .l,.pad-dpad .r{top:33%;height:34%;width:36%}.pad-dpad .l{left:0}.pad-dpad .r{right:0}
.pad-shake{width:min(60vw,240px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#ffe7a8);border:8px solid #f0b72f;display:grid;place-items:center;font-weight:900;font-size:24px;color:#a8741a;transition:transform .08s}
.pad-foot{display:flex;justify-content:center;margin-top:10px}
</style>
</head>
<body>
<div class="remote" id="remote">
  <div class="top"><span class="led" id="led"></span><span id="state">Nicht verbunden</span></div>
  <div class="dpad">
    <button class="u" data-b="UP">▲</button><button class="d" data-b="DOWN">▼</button>
    <button class="l" data-b="LEFT">◀</button><button class="r" data-b="RIGHT">▶</button><div class="c"></div>
  </div>
  <button class="btnA" data-b="A">A</button>
  <div class="row3">
    <button class="sm" data-b="MINUS">−</button>
    <button class="home" data-b="HOME" aria-label="Home"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M3 11 L12 3 L21 11 V21 H14 V14 H10 V21 H3Z" fill="#1b9fd6"/></svg></button>
    <button class="sm" data-b="PLUS">+</button>
  </div>
  <button class="center" id="center">Cursor zentrieren</button>
  <button class="btnB" data-b="B">B</button>
  <div class="brand">FERNBEDIENUNG</div>
</div>
<button class="opt" id="opt">Optionen</button>

<div class="wheel" id="wheel">
  <button class="w-brake" data-b="BRAKE">BREMSE</button>
  <div class="w-mid">
    <div class="w-info" id="w-info"><b>–</b><br>Handy quer halten und neigen</div>
    <button class="w-item" data-b="ITEM">ITEM</button>
    <button class="w-drift" data-b="DRIFT">DRIFT</button>
    <div class="w-row"><div class="w-steer"><i id="w-steer"></i></div><button class="home" data-b="HOME" aria-label="Home"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 11 L12 3 L21 11 V21 H14 V14 H10 V21 H3Z" fill="#1b9fd6"/></svg></button></div>
  </div>
  <button class="w-gas" data-b="GAS">GAS</button>
</div>
<div class="pad" id="pad"></div>
<div class="sheet" id="sheet">
  <label>Links und rechts vertauschen <input type="checkbox" id="o-ix"></label>
  <label>Oben und unten vertauschen <input type="checkbox" id="o-iy"></label>
  <label>Achsen tauschen <input type="checkbox" id="o-sw"></label>
  <label>Ruhezone gegen Zittern <input type="range" id="o-dz" min="0" max="8" step="0.5"></label>
  <label>Verbindung <button class="center" id="o-re">Neu verbinden</button></label>
  <p style="text-align:center;margin:14px 0 0"><button class="big" id="o-close">Fertig</button></p>
</div>

<div class="over" id="over">
  <h1>Fernbedienung</h1>
  <p>Gib den Code ein, der auf dem Bildschirm der Konsole steht.</p>
  <input id="code" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false">
  <button class="big" id="go">Bewegung erlauben &amp; verbinden</button>
  <p class="msg" id="msg"></p>
  <p style="font-size:14px;color:#9aa0a5">Handy hochkant halten, Oberseite zeigt zum Bildschirm. Mit A wählst du aus, mit B gehst du zurück.</p>
</div>

<script src="lib/peerjs.min.js"></script>
<script>
{
  const $ = id => document.getElementById(id);
  const opt = Object.assign({ ix: false, iy: false, sw: false, dz: 2 }, (() => { try { return JSON.parse(localStorage.getItem('kk-remote2') || '{}'); } catch (e) { return {}; } })());
  const saveOpt = () => { try { localStorage.setItem('kk-remote2', JSON.stringify(opt)); } catch (e) {} };
  const params = new URLSearchParams(location.search);
  $('code').value = (params.get('c') || localStorage.getItem('kk-last') || '').toUpperCase();

  let peer = null, conn = null, motionOn = false, wake = null, player = 0, mode = 'pointer', padCfg = null;
  const PCOL = { 1: '#1b9fd6', 2: '#e5242f', 3: '#2eaa4f', 4: '#f0a500' };
  const setState = (t, on) => { $('state').textContent = t; $('led').classList.toggle('on', !!on); };
  const send = o => { if (conn && conn.open) try { conn.send(o); } catch (e) {} };

  async function askMotion() {
    try {
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        const r = await DeviceMotionEvent.requestPermission(); if (r !== 'granted') return false;
      }
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try { await DeviceOrientationEvent.requestPermission(); } catch (e) {}
      }
      return true;
    } catch (e) { return false; }
  }

  function connect(code) {
    $('msg').textContent = 'Verbinde …';
    if (typeof Peer === 'undefined') { $('msg').textContent = 'Verbindungsbibliothek fehlt.'; return; }
    if (peer) try { peer.destroy(); } catch (e) {}
    peer = new Peer({ debug: 0 });
    peer.on('open', () => {
      const c = peer.connect('kk-konsole-' + code.toLowerCase(), { reliable: true, serialization: 'json' });
      const to = setTimeout(() => { if (!c.open) $('msg').textContent = 'Konsole nicht gefunden. Code prüfen und Konsole geöffnet lassen.'; }, 8000);
      c.on('open', () => {
        clearTimeout(to); conn = c; localStorage.setItem('kk-last', code);
        $('over').classList.add('hide'); setState('Verbunden mit ' + code, true);
        send({ t: 'hi' }); keepAwake();
      });
      c.on('data', d => {
        if (!d) return;
        if (d.t === 'screen' && mode === 'pointer') setState((player ? 'Spieler ' + player + ' · ' : '') + (d.ch ? d.ch : 'Verbunden'), true);
        else if (d.t === 'player') { player = d.n; $('led').style.background = PCOL[player] || ''; setState('Spieler ' + player + ' verbunden', true); }
        else if (d.t === 'mode') setMode(d.m, d.cfg);
        else if (d.t === 'hud') $('w-info').innerHTML = '<b>' + d.pos + '.</b> Platz · Runde ' + d.lap + '<br>' + (d.item ? 'Item: ' + d.item : '&nbsp;');
        else if (d.t === 'full') $('msg').textContent = 'Es sind schon vier Fernbedienungen verbunden.';
      });
      c.on('close', () => { conn = null; setState('Getrennt', false); $('over').classList.remove('hide'); $('msg').textContent = 'Verbindung verloren. Nochmal verbinden?'; });
      c.on('error', () => {});
    });
    peer.on('error', e => {
      if (e.type === 'peer-unavailable') $('msg').textContent = 'Konsole mit diesem Code nicht gefunden.';
      else $('msg').textContent = 'Verbindungsfehler (' + e.type + ').';
    });
  }

  async function keepAwake() { try { if ('wakeLock' in navigator) wake = await navigator.wakeLock.request('screen'); } catch (e) {} }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && conn) keepAwake(); });

  $('go').addEventListener('click', async () => {
    const code = $('code').value.trim().toUpperCase();
    if (code.length !== 4) { $('msg').textContent = 'Der Code hat 4 Zeichen.'; return; }
    motionOn = await askMotion();
    if (!motionOn) { $('msg').textContent = 'Ohne Bewegungsdaten geht nur das Steuerkreuz. Safari: aA-Menü > Website-Einstellungen prüfen.'; }
    connect(code);
  });

  // ---------- Bewegung: Drehrate des Gyroskops wird zu Cursor-Schritten ----------
  let ax = 0, ay = 0, lastT = 0, up = [0, 0, 1];
  const IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  addEventListener('deviceorientation', e => {
    if (e.beta == null) return;
    const b = e.beta * Math.PI / 180, g = (e.gamma || 0) * Math.PI / 180;
    up = [-Math.cos(b) * Math.sin(g), Math.sin(b), Math.cos(b) * Math.cos(g)];
  });
  addEventListener('devicemotion', e => {
    const r = e.rotationRate; if (!r || r.alpha == null) return;
    const now = performance.now(), dt = lastT ? Math.min(0.05, (now - lastT) / 1000) : 0.016; lastT = now;
    // Safari auf iPhone/iPad liefert die Drehraten in anderer Reihenfolge als Chrome auf Android:
    // iOS: alpha = um x, beta = um y, gamma = um z. Spezifikation/Android: alpha = um z, beta = um x, gamma = um y.
    const w = IOS ? [r.alpha || 0, r.beta || 0, r.gamma || 0] : [r.beta || 0, r.gamma || 0, r.alpha || 0]; // Drehrate um x, y, z in Grad/s
    let yaw = w[0] * up[0] + w[1] * up[1] + w[2] * up[2];                     // Drehung um die Senkrechte
    let pitch = w[0];                                                         // Kippen um die Querachse
    if (Math.abs(yaw) < opt.dz) yaw = 0; if (Math.abs(pitch) < opt.dz) pitch = 0;
    let x = -yaw * dt, y = -pitch * dt;
    if (opt.sw) [x, y] = [y, x];
    if (opt.ix) x = -x; if (opt.iy) y = -y;
    ax += x; ay += y;
  });
  setInterval(() => { if ((ax || ay) && conn && mode === 'pointer') { send({ t: 'm', x: +ax.toFixed(3), y: +ay.toFixed(3) }); } ax = ay = 0; }, 16);

  // ---------- Lenkrad: Neigung des quer gehaltenen Handys ----------
  let gx = 0, gy = -9.8, steer = 0, gam = 0;
  addEventListener('deviceorientation', e => { if (e.gamma != null) gam = e.gamma; });
  addEventListener('devicemotion', e => {
    const a = e.accelerationIncludingGravity; if (!a || a.x == null) return;
    gx = gx * 0.75 + a.x * 0.25; gy = gy * 0.75 + a.y * 0.25;
    const ang = Math.atan2(gy, gx), neutral = Math.cos(ang) >= 0 ? 0 : Math.PI;
    let d = ang - neutral; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI;
    const deg = d * 180 / Math.PI, dz = 3;
    let v = Math.abs(deg) < dz ? 0 : (deg - Math.sign(deg) * dz) / 35;
    v = Math.max(-1, Math.min(1, v)); if (opt.ix) v = -v;
    steer = v;
  });
  setInterval(() => {
    if (mode !== 'wheel') return;
    send({ t: 's', v: +steer.toFixed(3) });
    $('w-steer').style.left = (50 + steer * 46) + '%';
    const w = $('wheel'), portrait = innerHeight > innerWidth;
    w.classList.toggle('rot', portrait);
    w.style.transform = 'translate(-50%,-50%)' + (portrait ? (gam < 0 ? ' rotate(90deg)' : ' rotate(-90deg)') : '');
  }, 33);
  function setMode(m, cfg) {
    document.querySelectorAll('button.down').forEach(b => { b.classList.remove('down'); send({ t: 'b', b: b.dataset.b, d: 0 }); });
    mode = m; padCfg = m === 'pad' ? (cfg || {}) : null;
    $('wheel').classList.toggle('on', m === 'wheel'); $('pad').classList.toggle('on', m === 'pad');
    $('remote').style.visibility = m === 'pointer' ? '' : 'hidden';
    $('opt').style.display = m === 'pointer' ? '' : 'none';
    if (m === 'pad') renderPad(padCfg);
  }
  // ---------- Spielfeld-Modus: Tasten, Quiz, Schütteln, Neigen ----------
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let tb0 = null, tg0 = null, tb = 0, tg = 0, shakeE = 0, shakePeak = 0;
  function renderPad(c) {
    const col = PCOL[player] || '#1b9fd6';
    const qc = ['#e5242f', '#1b9fd6', '#2eaa4f', '#f0a500'];
    let body = '';
    if (c.shake) body += '<div class="pad-shake" id="pad-sh">Schütteln!</div>';
    if (c.quiz) body += '<div class="pad-quiz">' + (c.labels || ['A', 'B', 'C', 'D']).map((l, i) => `<button data-b="Q${i + 1}" style="background:${qc[i]}">${esc(l)}</button>`).join('') + '</div>';
    if (c.dpad) body += '<div class="pad-dpad"><button class="u" data-b="UP">▲</button><button class="d" data-b="DOWN">▼</button><button class="l" data-b="LEFT">◀</button><button class="r" data-b="RIGHT">▶</button></div>';
    if (c.buttons && c.buttons.length) body += '<div class="pad-btns">' + c.buttons.map(b => `<button data-b="${esc(b.b)}" style="background:${b.color || col}">${esc(b.label)}</button>`).join('') + '</div>';
    $('pad').innerHTML = `<div class="pad-head" style="background:${col}"><span>Spieler ${player}</span><span>${esc(c.title || '')}</span></div><div class="pad-hint">${esc(c.hint || '')}</div><div class="pad-body">${body}</div>
      <div class="pad-foot"><button class="home" data-b="HOME" aria-label="Home" style="box-shadow:0 4px 0 #c4c8cc"><svg viewBox="0 0 24 24" width="24" height="24"><path d="M3 11 L12 3 L21 11 V21 H14 V14 H10 V21 H3Z" fill="#1b9fd6"/></svg></button></div>`;
    $('pad').querySelectorAll('[data-b]').forEach(bindBtn);
    tb0 = tg0 = null;
  }
  addEventListener('deviceorientation', e => { if (e.beta == null) return; tb = e.beta; tg = e.gamma || 0; if (padCfg && padCfg.tilt && tb0 == null) { tb0 = tb; tg0 = tg; } });
  addEventListener('devicemotion', e => {
    if (!padCfg || !padCfg.shake) return;
    const a = e.acceleration; let m;
    if (a && a.x != null) m = Math.hypot(a.x, a.y, a.z);
    else { const g = e.accelerationIncludingGravity; if (!g || g.x == null) return; m = Math.abs(Math.hypot(g.x, g.y, g.z) - 9.81); }
    shakePeak = Math.max(shakePeak, m);
  });
  setInterval(() => {
    if (mode !== 'pad' || !padCfg) return;
    if (padCfg.shake) {
      shakeE = shakeE * 0.6 + shakePeak * 0.4; send({ t: 'sh', e: +shakePeak.toFixed(2) }); shakePeak = 0;
      const el = $('pad-sh'); if (el) el.style.transform = `scale(${1 + Math.min(0.25, shakeE / 60)}) rotate(${Math.min(12, shakeE) * (Math.random() - 0.5)}deg)`;
    }
    if (padCfg.tilt && tb0 != null) {
      let x = Math.max(-1, Math.min(1, (tg - tg0) / 25)), y = Math.max(-1, Math.min(1, (tb - tb0) / 25));
      if (opt.ix) x = -x; if (opt.iy) y = -y;
      send({ t: 'tl', x: +x.toFixed(3), y: +y.toFixed(3) });
    }
  }, 50);

  // ---------- Tasten ----------
  function bindBtn(b) {
    const name = b.dataset.b;
    const down = e => { e.preventDefault(); b.classList.add('down'); send({ t: 'b', b: name, d: 1 }); };
    const upH = e => { e.preventDefault(); if (!b.classList.contains('down')) return; b.classList.remove('down'); send({ t: 'b', b: name, d: 0 }); };
    b.addEventListener('pointerdown', down); b.addEventListener('pointerup', upH); b.addEventListener('pointercancel', upH); b.addEventListener('pointerleave', upH);
  }
  document.querySelectorAll('[data-b]').forEach(bindBtn);
  $('center').addEventListener('click', () => send({ t: 'c' }));

  // ---------- Optionen ----------
  $('o-ix').checked = opt.ix; $('o-iy').checked = opt.iy; $('o-sw').checked = opt.sw; $('o-dz').value = opt.dz;
  ['ix', 'iy', 'sw'].forEach(k => $('o-' + k).addEventListener('change', e => { opt[k] = e.target.checked; saveOpt(); }));
  $('o-dz').addEventListener('input', e => { opt.dz = +e.target.value; saveOpt(); });
  $('opt').addEventListener('click', () => $('sheet').classList.add('on'));
  $('o-close').addEventListener('click', () => $('sheet').classList.remove('on'));
  $('o-re').addEventListener('click', () => { $('sheet').classList.remove('on'); $('over').classList.remove('hide'); });
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('touchmove', e => { if (!e.target.closest('.sheet')) e.preventDefault(); }, { passive: false });
}
</script>
</body>
</html>
